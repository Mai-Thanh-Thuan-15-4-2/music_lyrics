<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="galaxyCore" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#3b277a" />
      <stop offset="45%" stop-color="#141132" />
      <stop offset="100%" stop-color="#060714" />
    </radialGradient>
    <linearGradient id="nebulaRing" x1="10" y1="88" x2="110" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="48%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="vinylRim" x1="26" y1="26" x2="94" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Frame -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#galaxyCore)" stroke="url(#vinylRim)" stroke-width="2.2" stroke-opacity="0.55" />

  <!-- Ambient Nebula Haze -->
  <ellipse cx="42" cy="38" rx="28" ry="20" fill="#7c3aed" opacity="0.22" filter="url(#glow)" />
  <ellipse cx="78" cy="76" rx="26" ry="18" fill="#0ea5e9" opacity="0.18" filter="url(#glow)" />

  <!-- Starfield -->
  <circle cx="24" cy="26" r="1.8" fill="#e0f2fe" opacity="0.9" />
  <circle cx="94" cy="24" r="2.2" fill="#f5d0fe" opacity="0.95" />
  <circle cx="88" cy="92" r="1.6" fill="#bae6fd" opacity="0.8" />
  <circle cx="28" cy="90" r="1.9" fill="#ddd6fe" opacity="0.75" />
  <circle cx="66" cy="19" r="1.2" fill="#ffffff" opacity="0.7" />
  <circle cx="20" cy="60" r="1.1" fill="#ffffff" opacity="0.6" />

  <!-- Back Orbital Arc -->
  <path d="M 16 74 C 12 63, 35 44, 52 40" stroke="url(#nebulaRing)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.7" />

  <!-- Central Vinyl / Planet Disc -->
  <circle cx="60" cy="60" r="28" fill="#090a1a" stroke="url(#vinylRim)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="21" stroke="rgba(167,139,250,0.22)" stroke-width="1" stroke-dasharray="6 4" />
  <circle cx="60" cy="60" r="15" stroke="rgba(56,189,248,0.2)" stroke-width="1" />

  <!-- Audio Waveform Inside Planet -->
  <g filter="url(#glow)" stroke="url(#vinylRim)" stroke-linecap="round" stroke-width="4.2">
    <line x1="45" y1="56" x2="45" y2="64" />
    <line x1="52.5" y1="48" x2="52.5" y2="72" />
    <line x1="60" y1="43" x2="60" y2="77" />
    <line x1="67.5" y1="50" x2="67.5" y2="70" />
    <line x1="75" y1="55" x2="75" y2="65" />
  </g>

  <!-- Front Galaxy Orbital Ring -->
  <path d="M 16 74 C 26 88, 94 62, 104 45" stroke="url(#nebulaRing)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Orbiting Star Node -->
  <circle cx="90" cy="53" r="4.5" fill="#ffffff" filter="url(#glow)" />
</svg>
